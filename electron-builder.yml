appId: com.filmshape.dash
productName: Dash
protocols:
  - name: Dash Note
    schemes:
      - dashnotes
directories:
  output: dist
  buildResources: build
files:
  - 'out/**/*'
  - 'electron-main.js'
  - 'preload.js'
mac:
  icon: icons/Dashmac1024.icns
  target:
    - dmg
    - zip
  # Electron 44 needs macOS 13 (Ventura). Older Macs get a clear "needs a
  # newer macOS" message from Finder, and scripts/mark-min-macos.js keeps the
  # updater from offering them this release.
  minimumSystemVersion: '13.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: 'build/entitlements.mac.plist'
  entitlementsInherit: 'build/entitlements.mac.plist'
win:
  icon: icons/Dashwin512.ico
linux:
  icon: icons/Dashlin512.png
publish:
  provider: github
  owner: Efesop
  repo: rich-text-editor
  # Published by the release workflow once latest-mac.yml carries the
  # minimum macOS (scripts/mark-min-macos.js)
  releaseType: draft
afterSign: scripts/notarize.js
